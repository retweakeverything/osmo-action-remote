name: Release

# Push a tag like v0.2.0 to build a signed APK and the ESP32 relay images and
# publish them on the Releases page.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: "1.5.1"

      - name: Build relay images
        env:
          INSTALL_DEPS: "1"
        run: firmware/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: firmware/dist/

  release:
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Work out version from the tag
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          IFS=. read -r major minor patch <<< "${name%%-*}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OSMO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::OSMO_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed APK
        working-directory: android
        env:
          OSMO_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          OSMO_KEYSTORE_PASSWORD: ${{ secrets.OSMO_KEYSTORE_PASSWORD }}
          OSMO_KEY_ALIAS: ${{ secrets.OSMO_KEY_ALIAS }}
          OSMO_KEY_PASSWORD: ${{ secrets.OSMO_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon :protocol:test :core:test :app:assembleRelease
          -PappVersionName=${{ steps.ver.outputs.name }}
          -PappVersionCode=${{ steps.ver.outputs.code }}

      - name: Verify signature and prepare files
        run: |
          apk="osmo-action-remote-${{ steps.ver.outputs.name }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME"/build-tools/36.1.0/apksigner verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware
          path: firmware-dist

      - name: Write release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then cat "$notes" > release-notes.md
          else echo "::warning::$notes not found; publishing install notes only"; : > release-notes.md; fi
          sed "s/<version>/${{ steps.ver.outputs.name }}/g" docs/releases/install.md >> release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          osmo-action-remote-${{ steps.ver.outputs.name }}.apk
          osmo-action-remote-${{ steps.ver.outputs.name }}.apk.sha256
          firmware-dist/osmo-bridge-esp32.bin
          firmware-dist/osmo-bridge-esp32c3.bin
          firmware-dist/osmo-bridge-esp32s3.bin
          firmware-dist/SHA256SUMS
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes
